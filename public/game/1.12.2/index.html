<!DOCTYPE html>
<html lang="vi" style="width:100%;height:100%;background:#000;margin:0;padding:0;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eaglercraft 1.12.2</title>
    <link type="image/png" rel="shortcut icon" href="favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; }

        #game-container {
            width: 100%; height: 100%; position: relative; background: #000;
        }

        #loading-screen {
            position: fixed; inset: 0; background: #1a1a1a;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #fff; font-family: 'Courier New', monospace; z-index: 9999;
            transition: opacity 0.5s ease;
        }
        #loading-screen .icon { font-size: 64px; margin-bottom: 16px; }
        #loading-screen .title { font-size: 22px; font-weight: bold; margin-bottom: 8px; }
        #loading-screen .status { font-size: 13px; color: #aaa; margin-bottom: 24px; }
        #loading-screen .bar-wrap {
            width: 320px; height: 6px; background: #333; border-radius: 3px; overflow: hidden;
        }
        #loading-screen .bar {
            height: 100%; background: #4caf50; border-radius: 3px; width: 0%;
            animation: loading-anim 8s ease-in-out forwards;
        }
        @keyframes loading-anim {
            0% { width: 0%; } 20% { width: 20%; } 50% { width: 60%; } 80% { width: 85%; } 100% { width: 95%; }
        }
        #loading-screen.hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="icon">&#9935;</div>
        <div class="title">Eaglercraft 1.12.2</div>
        <div class="status" id="loading-status">Đang tải cấu hình game...</div>
        <div class="bar-wrap"><div class="bar"></div></div>
    </div>

    <!-- Nơi chứa game -->
    <div id="game-container" tabindex="0"></div>

    <script>
        var _params = new URLSearchParams(window.location.search);
        var _username = _params.get('username') || 'Player';

        // Cấu hình chuẩn cho classes.js
        window.eaglercraftXOpts = {
            container: "game-container",
            assetsURI: "assets.epk",
            localesURI: "lang/",
            worldsDB: "worlds",
            resourcePacksDB: "resourcePacks",
            localStorageNamespace: "_eaglercraft_1.12",
            demoMode: false,
            crashOnUncaughtExceptions: true,
            allowVoiceClient: true,
            allowFNAWSkins: true,
            servers: [
                {
                    name: "ArchMC Network",
                    addr: "wss://mc.arch.lol",
                    hideAddr: false
                }
            ],
            relays: [
                { addr: "wss://relay.deev.is/", name: "Deev.is Relay", primary: true },
                { addr: "wss://relay.lax1dude.net/", name: "lax1dude Relay #1" }
            ]
        };
    </script>

    <script>
        // === PHÁT HIỆN THIẾT BỊ TRƯỚC KHI SPOOF ===
        // Phải lưu trước khi thay đổi userAgent
        var _isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
            || (navigator.maxTouchPoints > 0 && !/Win/i.test(navigator.platform));

        // === BYPASS MOBILE DETECTION ===
        // Giả mạo userAgent thành Desktop để game bỏ qua màn hình "Mobile Browser Detected"
        try {
            Object.defineProperty(navigator, 'userAgent', {
                get: function() {
                    return 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36';
                },
                configurable: true
            });
            // Cũng override maxTouchPoints để game không nhận ra thiết bị cảm ứng
            Object.defineProperty(navigator, 'maxTouchPoints', {
                get: function() { return 0; },
                configurable: true
            });
        } catch(e) { console.warn('Cannot spoof userAgent:', e); }

        // Dự phòng: Nếu màn hình mobile vẫn hiện, tự động click nút "Launch EaglercraftX"
        var _mobileBypassInterval = setInterval(function() {
            // Tìm tất cả các link/button có text "Launch EaglercraftX" hoặc "launch"
            var allLinks = document.querySelectorAll('a, button, input[type="button"]');
            for (var i = 0; i < allLinks.length; i++) {
                var el = allLinks[i];
                var txt = (el.textContent || el.value || '').toLowerCase();
                if (txt.indexOf('launch') !== -1 || txt.indexOf('eaglercraftx') !== -1) {
                    console.log('[Mobile Fix] Auto-clicking launch button:', el);
                    el.click();
                    clearInterval(_mobileBypassInterval);
                    return;
                }
            }
        }, 500);
        // Dừng tìm sau 15 giây (tránh chạy mãi)
        setTimeout(function() { clearInterval(_mobileBypassInterval); }, 15000);
    </script>

    <!-- Tải Core Game Mới Nhất -->
    <script src="classes.js"></script>

    <script>
        var _virtualPointerLock = false;

        if (_isMobileDevice) {
            // === CHỈ DÙNG VIRTUAL POINTER LOCK TRÊN MOBILE ===
            // Desktop dùng real pointer lock bình thường (ẩn con trỏ, capture mouse)
            try {
                var _desc = Object.getOwnPropertyDescriptor(Document.prototype, 'pointerLockElement') || Object.getOwnPropertyDescriptor(document, 'pointerLockElement');
                var _getPointerLock = _desc ? _desc.get : function() { return null; };
                Object.defineProperty(document, 'pointerLockElement', {
                    get: function() {
                        if (_virtualPointerLock) return document.getElementById('game-container').querySelector('canvas');
                        return _getPointerLock.call(document);
                    }
                });
            } catch (e) { console.warn("Cannot override pointerLockElement", e); }

            // Khi game gọi requestPointerLock() → ta tự approve và báo parent "đang trong game"
            try {
                HTMLElement.prototype.requestPointerLock = function() {
                    _virtualPointerLock = true;
                    try { window.parent.postMessage({ type: 'game-state', inGame: true }, '*'); } catch(e) {}
                    setTimeout(function() {
                        try { document.dispatchEvent(new Event('pointerlockchange')); } catch(e) {}
                        try { document.dispatchEvent(new Event('mozpointerlockchange')); } catch(e) {}
                    }, 0);
                };
            } catch(e) { console.warn('Cannot override requestPointerLock', e); }

            // Khi game gọi exitPointerLock() → ta báo parent "đang ở menu"
            try {
                document.exitPointerLock = function() {
                    _virtualPointerLock = false;
                    try { window.parent.postMessage({ type: 'game-state', inGame: false }, '*'); } catch(e) {}
                    setTimeout(function() {
                        try { document.dispatchEvent(new Event('pointerlockchange')); } catch(e) {}
                        try { document.dispatchEvent(new Event('mozpointerlockchange')); } catch(e) {}
                    }, 0);
                };
            } catch(e) { console.warn('Cannot override exitPointerLock', e); }

        } else {
            // === DESKTOP: Dùng real pointer lock, nhưng vẫn báo parent game state ===
            // Intercept để biết lúc nào vào/ra game (dùng cho MobileControls nếu cần)
            try {
                var _origRPL = HTMLElement.prototype.requestPointerLock;
                HTMLElement.prototype.requestPointerLock = function() {
                    // Gọi real pointer lock (ẩn cursor, capture mouse)
                    _origRPL.call(this);
                    try { window.parent.postMessage({ type: 'game-state', inGame: true }, '*'); } catch(e) {}
                };
            } catch(e) {}

            try {
                var _origEPL = document.exitPointerLock ? document.exitPointerLock.bind(document) : null;
                document.exitPointerLock = function() {
                    if (_origEPL) _origEPL();
                    try { window.parent.postMessage({ type: 'game-state', inGame: false }, '*'); } catch(e) {}
                };
            } catch(e) {}
        }

        window.addEventListener("load", function() {
            document.getElementById('loading-status').textContent = 'Đang khởi tạo Engine WebGL...';
            
            // Khởi động Eaglercraft 1.12.2
            main();

            // Xử lý ẩn màn hình loading & lấy nét (focus) cho bàn phím
            var _gameContainer = document.getElementById('game-container');
            var _observer = new MutationObserver(function(mutations) {
                for (var i = 0; i < mutations.length; i++) {
                    if (mutations[i].addedNodes.length > 0) {
                        document.getElementById('loading-status').textContent = 'Vào game thành công!';
                        setTimeout(function() {
                            var screen = document.getElementById('loading-screen');
                            if (screen) {
                                screen.classList.add('hidden');
                                setTimeout(function() { if(screen.parentNode) screen.parentNode.removeChild(screen); }, 600);
                            }
                        }, 1000);
                        _observer.disconnect();
                        
                        // Ép trình duyệt nhận diện bàn phím ngay lập tức
                        _gameContainer.focus();
                        window.focus();
                        break;
                    }
                }
            });
            _observer.observe(_gameContainer, { childList: true, subtree: true });
        });
        
        // Sửa lỗi kẹt phím / không gõ được chữ khi click chuột
        window.addEventListener('click', function() {
            window.focus();
            document.getElementById('game-container').focus();
        });

        // Lắng nghe sự kiện bàn phím từ play.html truyền vào (để sửa lỗi chat và đi chuyển)
        window.addEventListener('message', function(event) {
            var data = event.data;
            if (!data || !data.type) return;
            if (data.type === 'key-down') {
                document.dispatchEvent(new KeyboardEvent('keydown', { key: data.key, code: data.code, keyCode: data.keyCode, which: data.keyCode, bubbles: true }));
            } else if (data.type === 'key-up') {
                document.dispatchEvent(new KeyboardEvent('keyup', { key: data.key, code: data.code, keyCode: data.keyCode, which: data.keyCode, bubbles: true }));
            } else if (data.type === 'mousedown' || data.type === 'mouseup' || data.type === 'mousemove' || data.type === 'click') {
                var canvas = document.getElementById('game-container').querySelector('canvas') || document.getElementById('game-container');
                if (canvas) {
                    var e = new MouseEvent(data.type, {
                        clientX: data.clientX, clientY: data.clientY,
                        screenX: data.screenX || data.clientX, screenY: data.screenY || data.clientY,
                        movementX: data.movementX || 0, movementY: data.movementY || 0,
                        button: data.button || 0, buttons: data.buttons || 0,
                        bubbles: true, cancelable: true, view: window
                    });
                    canvas.dispatchEvent(e);
                }
            } else if (data.type === 'execute-script') {
                try {
                    var script = document.createElement('script');
                    script.textContent = data.code;
                    document.body.appendChild(script);
                    window.parent.postMessage({ type: 'script-executed', status: 'success' }, '*');
                } catch (e) {
                    window.parent.postMessage({ type: 'script-executed', status: 'error', message: e.toString() }, '*');
                }
            } else if (data.type === 'set-virtual-lock') {
                _virtualPointerLock = !!data.value;
            }
        });
    </script>
</body>
</html>
