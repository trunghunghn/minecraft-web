<!DOCTYPE html>
<html lang="vi" style="width:100%;height:100%;background-color:black;">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0">
    <title>Minecraft 1.12.2 - Playing</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%; height: 100%; overflow: hidden;
            background: black;
            font-family: 'Inter', sans-serif;
        }

        #game-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        #back-btn {
            position: fixed; top: 16px; right: 16px; z-index: 9999;
            background: rgba(0,0,0,0.6);
            color: white;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 8px 18px; border-radius: 10px; cursor: pointer;
            font-size: 13px; font-weight: 600;
            backdrop-filter: blur(10px);
            transition: background 0.2s;
            text-decoration: none;
        }
        #back-btn:hover { background: rgba(255,255,255,0.15); }
    </style>
</head>

<body>
    <a id="back-btn" href="/">✕ Thoat Game</a>
    <iframe
        id="game-iframe"
        allowfullscreen
        allow="pointer-lock *; fullscreen *"
    ></iframe>

    <script>
        (function() {
            var urlParams = new URLSearchParams(window.location.search);
            var username = urlParams.get('username') || 'Steve';
            var mobile = urlParams.get('mobile') || 'false';

            // Nhung index.html vao iframe voi username va mobile parameter
            var gameUrl = 'index.html?username=' + encodeURIComponent(username) + '&mobile=' + mobile;
            document.getElementById('game-iframe').src = gameUrl;
        })();
    </script>
</body>
</html>
